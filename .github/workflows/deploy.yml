name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN'e Pages'e yayınlama ve OIDC ile kimlik doğrulama izni verir.
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek bir yayın çalışsın; yeni push devam eden yayını iptal etsin.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Özel alan adı (public/CNAME ile aynı olmalı). Alan adı kökten servis
  # edildiği için BASE_PATH gerekmez; varsayılan "/" kullanılır.
  SITE_URL: https://av.bengisuarslan.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build

      # NOT: GITHUB_TOKEN Pages sitesini oluşturamaz (admin gerekir). Depo
      # ayarlarında Settings > Pages > Source bir kez "GitHub Actions"
      # seçilmelidir; sonrasında bu adım mevcut siteyi okuyup devam eder.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
