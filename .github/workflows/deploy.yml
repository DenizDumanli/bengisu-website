name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN'e Pages'e yayınlama ve OIDC ile kimlik doğrulama izni verir.
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek bir yayın çalışsın; yeni push devam eden yayını iptal etsin.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # GitHub Pages proje sitesi: https://<owner>.github.io/<repo>/
  # Özel alan adına geçerken bu iki değeri güncelleyin (BASE_PATH: /).
  SITE_URL: https://denizdumanli.github.io
  BASE_PATH: /bengisu-website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Pages kaynağını "GitHub Actions" olarak ayarlar (zaten ayarlıysa atlar).
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
